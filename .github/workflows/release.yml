name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted
# publishing: no token is stored in GitHub, and every release carries a signed
# provenance statement linking it to this workflow run and commit.
#
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub
# Actions, repository atannex/bridge-js, workflow release.yml, environment npm.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11, which trusted publishing needs.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - name: Check CHANGELOG has the version
        run: grep -q "^## ${GITHUB_REF_NAME#v} " CHANGELOG.md
      - run: npm ci
      # prepublishOnly runs every check (types, lint, coverage, exports, API report, size).
      - run: npm publish --provenance --access public
