name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (the tag is in the comment); Dependabot
# keeps them current.
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.node != '22'
        run: npm test
      # The tooling (coverage, TypeScript checks, ESLint, API and size checks) runs once, on Node 22.
      - if: matrix.node == '22'
        run: npm run test:coverage
      - if: matrix.node == '22'
        run: npm run typecheck
      - if: matrix.node == '22'
        run: npm run test:types
      - if: matrix.node == '22'
        run: npm run lint
      - if: matrix.node == '22'
        run: npm run format:check
      - if: matrix.node == '22'
        run: npm run check:exports
      - if: matrix.node == '22'
        run: npm run api:check
      - if: matrix.node == '22'
        run: npm run size
      - if: matrix.node == '22'
        run: npm audit --audit-level=moderate

  # Node 18 is past end-of-life and the test tooling (Vitest 4) no longer runs
  # on it. The package still declares Node 18 support for the 1.x line, so the
  # built package is smoke-tested there; it is dropped in 2.0.
  node18:
    name: Node 18 (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - run: node tests/smoke/run.mjs

  # The built package in other runtimes. The checks (tests/smoke/smoke.mjs)
  # use an in-memory fetch, so no server is involved.
  runtimes:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.1.38
      - if: matrix.runtime == 'bun'
        run: bun tests/smoke/run.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read tests/smoke/run.mjs
      - if: matrix.runtime == 'chromium'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/smoke/browser.mjs

  # Against a real Laravel backend: the example app in atannex/bridge-workspace
  # with atannex/bridge, checked out side by side as they sit locally. Runs
  # the SDK integration tests, the generated-contract check and the Expo flow.
  # Manual only until atannex/bridge-workspace is on GitHub; locally, run
  # bridge-workspace/scripts/integration.sh.
  integration:
    name: Laravel integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bridge-js
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atannex/bridge
          path: bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atannex/bridge-workspace
          path: bridge-workspace
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          (cd bridge-js && npm ci && npm run build && mkdir -p ../bridge-workspace/vendor-packs && npm pack --pack-destination ../bridge-workspace/vendor-packs)
          (cd bridge-workspace/laravel-app && composer install --no-interaction --no-progress && cp .env.example .env && php artisan key:generate)
          (cd bridge-workspace/expo-app && npm ci)
      - name: Integration
        run: bridge-workspace/scripts/integration.sh
